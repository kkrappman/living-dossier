<title>The Living Dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F2F4F3; --panel:#F8FAF9; --surface:#FFFFFF; --ink:#18201D; --ink-2:#46524D; --muted:#76827D;
  --line:#D9E0DC; --line-2:#E8ECEA;
  --accent:#2E6B57; --accent-ink:#FFFFFF; --accent-soft:#E0EDE7; --accent-text:#245545;
  --warm:#A94F28; --warm-soft:#F6E5DA; --danger:#B03636; --danger-soft:#F7E1E1;
  --av-l:86%; --av-t:26%;
  --shadow:0 1px 2px rgba(20,32,27,.05),0 6px 20px rgba(20,32,27,.06);
  --ui:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader",ui-serif,Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-cc="light"]){
  color-scheme:dark;
  --bg:#101513; --panel:#141A18; --surface:#1A221F; --ink:#E5ECE8; --ink-2:#B2BDB8; --muted:#86928D;
  --line:#2A3531; --line-2:#212A27;
  --accent:#6DBE9D; --accent-ink:#0C1812; --accent-soft:#1D3129; --accent-text:#8ED4B7;
  --warm:#E68C60; --warm-soft:#382419; --danger:#E27C7C; --danger-soft:#3A1D1D;
  --av-l:27%; --av-t:84%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]:not([data-cc="light"]),:root[data-cc="dark"]{
  color-scheme:dark;
  --bg:#101513; --panel:#141A18; --surface:#1A221F; --ink:#E5ECE8; --ink-2:#B2BDB8; --muted:#86928D;
  --line:#2A3531; --line-2:#212A27;
  --accent:#6DBE9D; --accent-ink:#0C1812; --accent-soft:#1D3129; --accent-text:#8ED4B7;
  --warm:#E68C60; --warm-soft:#382419; --danger:#E27C7C; --danger-soft:#3A1D1D;
  --av-l:27%; --av-t:84%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}

#app{height:100%;display:grid;grid-template-columns:calc(340px * var(--zoom,1)) minmax(0,1fr)}
.side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.main{min-height:0;overflow-y:auto;overflow-x:hidden}
@media (max-width:859px){
  #app{grid-template-columns:minmax(0,1fr)}
  #app.show-detail .side{display:none}
  #app:not(.show-detail) .main{display:none}
  .side{border-right:0}
}

/* sidebar */
.side-head{padding:18px 16px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line-2)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;row-gap:8px}
.brand>.row{margin-left:auto;flex-shrink:0}
.brand h1{font:600 26px/1.1 var(--serif);letter-spacing:-.01em}
.brand h1 .h1-pre{font-weight:400;font-style:italic;color:var(--ink-2)}
.brand h1{white-space:nowrap}
.brand .count{white-space:nowrap}
:root[data-font="modern"] .brand h1{font-size:22px}
.brand .count{font:500 12px var(--mono);color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;font-size:14px;line-height:1.2;min-height:36px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--accent-soft);color:var(--accent-text)}
.btn.small{min-height:30px;padding:4px 9px;font-size:13px}
.btn.danger{color:var(--danger);border-color:var(--line)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn svg{width:16px;height:16px;flex:none}
.grow{flex:1}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--line-2);border-radius:9px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:7px;padding:6px;font-weight:500;font-size:14px;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px;font-size:15px}
.side-body{flex:1;min-height:0;overflow-y:auto;padding:6px 8px 16px}
.side-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line-2);font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--accent)}

.letter{font:500 11px var(--mono);color:var(--muted);letter-spacing:.08em;padding:12px 10px 4px}
.person{display:flex;gap:11px;align-items:center;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:8px 10px}
.person:hover{background:var(--line-2)}
.person[aria-current="true"]{background:var(--accent-soft)}
.person .txt{min-width:0;flex:1}
.person .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .how{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.warm{background:var(--warm-soft);color:var(--warm)}
.chip.ex{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:500}
.av{--h:150;flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:hsl(var(--h) 32% var(--av-l));color:hsl(var(--h) 45% var(--av-t));font:600 15px var(--ui)}
.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:88px;height:88px;font:500 32px var(--serif)}
.notice{margin:8px 6px;padding:10px 12px;border-radius:9px;background:var(--surface);border:1px dashed var(--line);font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:8px}
.empty-list{padding:28px 14px;color:var(--muted);font-size:14px;text-align:center}

/* upcoming */
.up-wrap{display:flex;flex-direction:column;gap:2px}
.up{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:9px 10px}
.up:hover{background:var(--line-2)}
.cal{border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:center;overflow:hidden;font-variant-numeric:tabular-nums}
.cal .m{font:500 10px var(--mono);letter-spacing:.1em;background:var(--accent-soft);color:var(--accent-text);padding:2px 0}
.cal .d{font:500 20px/1.3 var(--serif)}
.up.today .cal .m{background:var(--warm);color:#fff}
.up .what{font-size:13px;color:var(--muted)}
.up .when{font:500 12px var(--mono);color:var(--ink-2);white-space:nowrap}
.up.soon .when{color:var(--warm)}
.today-banner{margin:4px 6px 8px;padding:10px 12px;border-radius:9px;background:var(--warm-soft);color:var(--warm);font-size:14px;font-weight:500}

/* detail */
.detail{max-width:780px;margin:0 auto;padding-inline:24px;padding-block:20px 64px;display:flex;flex-direction:column;gap:28px}
@media (max-width:600px){.detail{padding-inline:16px;gap:24px}}
.topbar{display:flex;align-items:center;gap:8px;min-height:36px;position:sticky;top:0;z-index:5;background:var(--bg);margin-inline:-8px;padding:6px 8px}
.back{display:none}
@media (max-width:859px){.back{display:inline-flex}}
.status{font:500 12px var(--mono);color:var(--muted)}
.status.err{color:var(--danger)}
.hero{display:flex;gap:18px;align-items:center}
.pp{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.pp .av-btn{border:0;padding:0;background:transparent;border-radius:50%;position:relative}
.pp .av-btn:hover .av{filter:brightness(.92)}
.pp .pp-acts{display:flex;gap:2px}
.pp .pp-acts button{border:0;background:transparent;font-size:12px;color:var(--accent-text);padding:2px 6px;border-radius:6px}
.pp .pp-acts button:hover{background:var(--accent-soft)}
.pp .pp-acts button.rm{color:var(--muted)}
.hero .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.name-in{width:100%;border:0;background:transparent;font:600 34px/1.15 var(--serif);letter-spacing:-.015em;padding:2px 0;border-bottom:1px solid transparent}
.name-in:hover,.name-in:focus{border-bottom-color:var(--line);outline:none}
.how-lab{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.how-in{width:100%;resize:none;overflow:hidden;line-height:1.4;border:0;background:transparent;font-size:16px;color:var(--ink-2);padding:2px 0;border-bottom:1px solid var(--line-2)}
.how-in:focus{outline:none;border-bottom-color:var(--accent)}
@media (max-width:600px){.hero{gap:14px}.av.big{width:64px;height:64px;font-size:24px}.name-in{font-size:27px}}

.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.sec-h h2{font:600 20px/1.2 var(--serif)}
.sec-h .hint{font-size:13px;color:var(--muted)}
.sec-note{font-size:13px;color:var(--muted);margin:0}

.fields{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.fields:empty{display:none}
.f{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 8px 8px 14px;border-top:1px solid var(--line-2)}
.f:first-child{border-top:0}
.f label{font-size:13px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{width:100%;border:1px solid transparent;border-radius:6px;background:transparent;padding:5px 7px;font-size:15px}
.f input:hover,.f select:hover,.f textarea:hover{border-color:var(--line-2)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);outline:none;background:var(--bg)}
.f textarea{resize:vertical;min-height:54px}
.f .sub{font-size:12px;color:var(--muted);padding:0 7px}
.bday{display:flex;gap:6px;flex-wrap:wrap}
.multi{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.multi>input,.multi>select{width:auto;flex:1 1 80px;min-width:0}
.multi>.btn{flex:0 0 auto}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
.multi input,.multi select,.addr input,.parts input,.parts select,.parts textarea{border-color:var(--line-2)}
.addr{display:flex;flex-direction:column;gap:4px}
.parts{display:flex;flex-direction:column;gap:2px}
.part{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:center}
.part>span{font-size:13px;color:var(--ink-2)}
.f-head{display:flex;flex-direction:column;gap:2px;min-width:0}
.f .f-name{font-size:12px;padding:2px 6px;color:var(--ink-2);border-color:var(--line-2);width:100%}
.unit{font-size:14px;color:var(--muted)}
.f:has(.f-head){align-items:start}
.f:has(.f-head)>.x{margin-top:4px}
@media (max-width:600px){.f-head{grid-column:1/-1;flex-direction:row;align-items:center;gap:8px}.f .f-name{width:auto;flex:1}}
.f input[hidden],.f a[hidden]{display:none}
.f:has(.parts,.addr){align-items:start}
.f:has(.parts,.addr)>label,.f:has(.parts,.addr)>.x{margin-top:6px}
@media (max-width:600px){.part{grid-template-columns:88px minmax(0,1fr)}}
.bday select{width:auto;flex:1 1 90px}
.bday input{width:auto;flex:1 1 90px}
.x{border:0;background:transparent;color:var(--muted);border-radius:6px;width:30px;height:30px;display:grid;place-items:center}
.x:hover{background:var(--danger-soft);color:var(--danger)}
.x svg{width:14px;height:14px}
@media (max-width:600px){.f{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}.f label{grid-column:1/-1;padding-top:2px}}
.add-detail{align-self:flex-start;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:7px 12px;font-size:14px;color:var(--ink-2);max-width:100%}

/* rich text */
.rt{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rt:focus-within{border-color:var(--accent)}
.tb{display:flex;flex-wrap:wrap;gap:2px;padding:4px;border-bottom:1px solid var(--line-2);background:var(--panel)}
.tb button{border:0;background:transparent;border-radius:6px;width:32px;height:30px;display:grid;place-items:center;color:var(--ink-2)}
.tb button:hover{background:var(--line-2)}
.tb button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text)}
.tb svg{width:16px;height:16px}
.tb .sep{width:1px;background:var(--line);margin:5px 3px}
.ed{min-height:84px;padding:12px 14px;font:18px/1.55 var(--serif);outline:none;overflow-wrap:anywhere}
.ed p,.ed div{margin:0 0 .5em}
.ed ul,.ed ol{margin:0 0 .5em;padding-left:1.4em}
.ed.empty::before{content:attr(data-ph);color:var(--muted);font-style:italic;pointer-events:none;position:absolute}
.ed.empty{position:relative}
.ed b,.ed strong{font-weight:600}

.entries{display:flex;flex-direction:column;gap:14px}
.entry{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px}
.entry .when{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.entry .when input{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:4px 6px;font:500 12px var(--mono);width:100%}
.entry .when .yr{font:500 26px/1 var(--serif);color:var(--accent-text);font-variant-numeric:tabular-nums}
.entry .when .ago{font-size:12px;color:var(--muted)}
@media (max-width:600px){.entry{grid-template-columns:minmax(0,1fr);gap:6px}.entry .when{flex-direction:row;align-items:center;flex-wrap:wrap}.entry .when input{width:auto}}
.entry-foot{display:flex;justify-content:flex-end;padding-top:4px}

.others{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
@media (max-width:600px){.others{grid-template-columns:minmax(0,1fr)}}
.other .title-row{display:flex;gap:6px;align-items:center;padding:6px 6px 6px 12px;border-bottom:1px solid var(--line-2)}
.other .title-in{flex:1;min-width:0;border:0;background:transparent;font-weight:600;font-size:15px;padding:4px 0}
.other .title-in:focus{outline:none}
.other .ed{font-size:17px;min-height:64px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px dashed var(--line);background:transparent;border-radius:99px;padding:5px 11px;font-size:13px;color:var(--ink-2)}
.chips button:hover{border-color:var(--accent);color:var(--accent-text)}

.dates{display:flex;flex-direction:column;gap:8px}
.date-row{display:grid;grid-template-columns:minmax(0,1fr) 160px auto;gap:8px;align-items:center}
.date-row input{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:6px 9px;width:100%}
@media (max-width:600px){.date-row{grid-template-columns:minmax(0,1fr) auto}.date-row input[type=date]{grid-column:1/2}}

.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:4px}
.tile .thumb{position:relative;aspect-ratio:1;max-width:100%;border-radius:9px;overflow:hidden;background:var(--line-2);border:0;padding:0}
.tile .thumb img,.tile .thumb video{width:100%;height:100%;object-fit:cover;display:block}
.tile .play{position:absolute;inset:auto auto 8px 8px;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;font-size:11px;font-weight:600;padding:2px 8px}
.tile .acts{display:flex;gap:4px;flex-wrap:wrap}
.tile .loading{display:grid;place-items:center;height:100%;font-size:12px;color:var(--muted)}

.danger-zone{border-top:1px solid var(--line);padding-top:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.danger-zone .meta{font-size:12px;color:var(--muted);flex:1}

/* previous entries */
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.caret{width:14px;height:14px;flex:none;transition:transform .15s;color:var(--muted)}
details[open]>summary .caret{transform:rotate(90deg)}
.prev{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.prev>summary{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:600}
.prev>summary .count{font:500 12px var(--mono);color:var(--muted)}
.prev-list{border-top:1px solid var(--line-2)}
.prev-item{border-top:1px solid var(--line-2)}
.prev-item:first-child{border-top:0}
.prev-item>summary{display:grid;grid-template-columns:14px auto auto minmax(0,1fr);gap:10px;align-items:baseline;padding:9px 14px}
.prev-item>summary:hover{background:var(--panel)}
.prev-item .pd{font:500 13px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.prev-item .ago{font-size:12px;color:var(--muted);white-space:nowrap}
.prev-item .snip{font:italic 15px var(--serif);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev-item[open] .snip{visibility:hidden}
.prev-body{padding:4px 14px 14px 38px;display:flex;flex-direction:column;gap:8px}
.prev-body .date-line{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.prev-body input[type=date]{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:3px 6px;font:500 12px var(--mono)}
@media (max-width:600px){.prev-item>summary{grid-template-columns:14px auto minmax(0,1fr)}.prev-item .snip{display:none}.prev-body{padding-left:14px}}

/* connections */
.sel{font-size:14px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:6px 9px;max-width:100%;min-width:0}
.conns{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.conns:empty{display:none}
.conn{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 8px 10px 12px;border-top:1px solid var(--line-2)}
.conn:first-child{border-top:0}
.conn .av{width:32px;height:32px;font-size:12px}
.conn .nm{border:0;background:transparent;padding:0;text-align:left;font-weight:600;font-size:15px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conn .nm:hover{color:var(--accent-text);text-decoration:underline}
.conn .line{grid-column:2/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.picker{display:inline-flex;gap:6px;flex-wrap:wrap;max-width:100%}
.picker input{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:6px 9px;max-width:100%}
.conn-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.conn-form input{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:6px 9px}

/* display settings */
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{border-color:var(--muted);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.set-group{display:flex;flex-direction:column;gap:8px}
.set-group h3{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--line-2);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;border-radius:7px;padding:7px;font-weight:500;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}

<script>

const $ = s => document.querySelector(s);
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const [k,v] of Object.entries(props)){
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()){
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const svg = (d, extra='') => { const s = document.createElement('span'); s.style.display='contents'; s.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`; return s.firstChild; };

function hue(str){ let x = 0; for (const c of str||'') x = (x*31 + c.charCodeAt(0)) % 360; return x; }

/* confirm-in-place button */
function confirmBtn(label, armedLabel, action, cls='btn small danger'){
  let armed = false, t;

function parseAddress(v){
  const lines = (v||'').split('\n').map(x => x.trim()).filter(Boolean);

  const i = lines.findIndex(l => /^[^,]+,\s*[A-Za-z .]+(\s+[\w-]{3,10})?$/.test(l));

  const m = /^([^,]+),\s*([A-Za-z .]*?)(?:\s+([\w-]*\d[\w-]*))?$/.exec(lines[i]);

  r.street = lines[0] && i > 0 ? lines[0] : ''; r.unit = i > 1 ? lines.slice(1, i).join(', ') : '';
  r.country = lines.slice(i+1).join(', ');
  return r;
}

async function shrinkImage(file, maxDim, quality){
  if (!/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type) && file.type) return file;
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
    if (s === 1 && file.size < 3.5e6 && /jpeg|png|webp/.test(file.type)) return file;
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', quality));
  } catch(_){ return file; }
}
async function uploadMedia(file){
  const isVideo = (file.type||'').startsWith('video/') || /\.(mov|mp4|m4v|webm)$/i.test(file.name);
  if (S.mode !== 'store'){
    if (isVideo) throw new Error('Videos need the synced version of the app.');
    const small = await shrinkImage(file, 900, .8);
    const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(small); });
    return {id:url, kind:'image', name:file.name, added:Date.now()};
  }
  if (!S.assets) throw new Error('Uploading is not available in this view.');
  let blob = file, type;
  if (isVideo){
    if (file.size > 20*1024*1024) throw new Error(`This video is ${(file.size/1048576).toFixed(0)} MB. The limit for now is 20 MB, so try a shorter clip.`);
    type = /webm/.test(file.type) ? 'video/webm' : 'video/mp4';
  } else {
    blob = await shrinkImage(file, 2400, .88);
    type = blob.type && /^image\/(png|jpeg|gif|webp)$/.test(blob.type) ? blob.type : 'image/jpeg';
  }
  const r = await withRetry(() => S.assets.upload(blob, {type}));
  return {id:r.id, kind:isVideo ? 'video' : 'image', name:file.name, added:Date.now()};
}

/* ---------- iPhone import (vCard) ---------- */
function unesc(s){ return s.replace(/\\n/gi, '\n').replace(/\\([,;\\])/g, '$1'); }
function parseVcf(text){
  const lines = text.replace(/\r\n?/g, '\n').replace(/\n[ \t]/g, '').split('\n');
  const cards = []; let c = null;
  for (const raw of lines){
    if (/^BEGIN:VCARD/i.test(raw)){ c = {props:[]}; continue; }
    if (/^END:VCARD/i.test(raw)){ if (c) cards.push(c); c = null; continue; }
    if (!c || !raw) continue;
    const i = raw.indexOf(':'); if (i < 0) continue;
    const left = raw.slice(0, i), value = raw.slice(i+1);
    const parts = left.split(';'); let name = parts[0].toUpperCase(), group = '';
    if (name.includes('.')){ [group, name] = name.split('.'); }
    c.props.push({name, group, params:parts.slice(1).join(';').toUpperCase(), value});
  }
  return cards.map(card => {
    const get = n => card.props.filter(p => p.name === n);
    const labelFor = g => { const l = card.props.find(p => p.group === g && p.name === 'X-ABLABEL'); return l ? unesc(l.value).replace(/^_\$!<|>!\$_$/g, '') : ''; };
    const nParts = (get('N')[0]?.value || '').split(';').map(unesc);
    let name = unesc(get('FN')[0]?.value || '').trim() || [nParts[3], nParts[1], nParts[2], nParts[0], nParts[4]].filter(Boolean).join(' ').trim();
    const org = unesc((get('ORG')[0]?.value || '').split(';')[0] || '').trim();
    if (!name) name = org;
    const p = blankPerson();
    p.name = name;
    const f = p.fields;
    const nick = get('NICKNAME')[0]; if (nick) f.nickname = unesc(nick.value);
    const typeName = pr => { const l = labelFor(pr.group); if (l) return l.charAt(0).toUpperCase() + l.slice(1); const t = /TYPE=([A-Z]+)/.exec(pr.params.replace(/TYPE=(PREF|VOICE|INTERNET|X-INTERNET)[;,]?/g, '')); const map = {CELL:'Mobile', IPHONE:'iPhone', HOME:'Home', WORK:'Work', MAIN:'Main', OTHER:'Other'}; return t ? (map[t[1]] || '') : ''; };
    const addMany = (k, items) => { const seen = new Set(); for (const [v, lab] of items){ if (!v || seen.has(v)) continue; seen.add(v); const key = nextFieldKey(p, {k}); f[key] = v; if (lab) p.fieldLabels[key] = lab; } };
    addMany('phone', get('TEL').map(t => [fmtPhoneOne(unesc(t.value).trim()), typeName(t)]));
    addMany('email', get('EMAIL').map(t => [unesc(t.value).trim(), typeName(t)]));
    addMany('address', get('ADR').map(adr => { const a = adr.value.split(';').map(unesc); return [[a[2], [a[3], a[4]].filter(Boolean).join(', ') + (a[5] ? ' ' + a[5] : ''), a[6]].map(x => (x||'').trim()).filter(Boolean).join('\n'), typeName(adr)]; }));
    if (org) f.employer = org;
    const title = get('TITLE')[0]; if (title) f.occupation = unesc(title.value);
    addMany('website', get('URL').map(u => [unesc(u.value).trim(), typeName(u)]));
    const bd = get('BDAY')[0];
    if (bd){ const v = bd.value.trim(); let m = /^(\d{4})-?(\d\d)-?(\d\d)/.exec(v); const m2 = /^--(\d\d)-?(\d\d)/.exec(v);
      if (m) f.birthday = `${m[1] === '1604' ? '-' : m[1]}-${m[2]}-${m[3]}`; else if (m2) f.birthday = `--${m2[1]}-${m2[2]}`; }
    for (const d of [...get('X-ABDATE'), ...get('ANNIVERSARY')]){
      const m = /(\d{4})-?(\d\d)-?(\d\d)/.exec(d.value); if (!m) continue;
      const lab = d.name === 'ANNIVERSARY' ? 'Anniversary' : (labelFor(d.group) || 'Date to remember');
      p.dates.push({id:uid(), label: lab.charAt(0).toUpperCase() + lab.slice(1), date:`${m[1] === '1604' ? '2000' : m[1]}-${m[2]}-${m[3]}`});
    }
    const note = get('NOTE')[0]; if (note && unesc(note.value).trim()){ const div = document.createElement('div'); unesc(note.value).trim().split(/\n+/).forEach(l => div.append(h('p', null, l))); p.other.push({id:uid(), title:'Notes from iPhone', html:div.innerHTML}); }
    const ph = get('PHOTO')[0];
    let photo = null;
    if (ph){ let v = ph.value.trim(); let mt = /TYPE=(PNG|GIF|JPE?G)/.exec(ph.params); const du = /^data:(image\/[a-z]+);base64,(.*)$/i.exec(v);
      if (du){ photo = {type:du[1].toLowerCase(), b64:du[2]}; } else if (/ENCODING=B|BASE64/.test(ph.params)){ photo = {type: mt ? 'image/' + mt[1].toLowerCase().replace('jpg','jpeg') : 'image/jpeg', b64:v}; } }
    p.imported = true; p.remind = false;
    return {p, photo};
  }).filter(x => x.p.name);
}
function b64ToBlob(b64, type){ const bin = atob(b64.replace(/\s/g, '')); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], {type}); }

function openImport(){
  const fileIn = h('input', {type:'file', accept:'.vcf,text/vcard,text/x-vcard', id:'vcfIn'});
  const status = h('div', {class:'sec-note', 'aria-live':'polite'});
  const bar = h('div', {class:'bar', hidden:true}, h('i'));
  const photos = h('input', {type:'checkbox', id:'impPhotos', checked:true});
  const go = h('button', {class:'btn primary', type:'button', disabled:true}, 'Import');
  const cancel = h('button', {class:'btn', type:'button'}, 'Close');
  let parsed = [], busy = false;
  const close = () => { if (!busy) ov.remove(); };
  cancel.onclick = close;
  fileIn.addEventListener('change', async () => {
    const f = fileIn.files[0]; if (!f) return;
    const text = await f.text();
    const all = parseVcf(text);
    const have = new Set([...S.people.values()].map(p => (p.name||'').trim().toLowerCase()));
    parsed = all.filter(x => !have.has(x.p.name.trim().toLowerCase()));
    const skip = all.length - parsed.length;
    status.textContent = all.length ? `Found ${all.length} contact${all.length === 1 ? '' : 's'}.` + (skip ? ` ${skip} already here by name and will be skipped.` : '') : 'No contacts found in that file. Make sure it is a .vcf export.';
    go.disabled = !parsed.length; go.textContent = `Import ${parsed.length} contact${parsed.length === 1 ? '' : 's'}`;
  });
  go.addEventListener('click', async () => {
    busy = true; go.disabled = true; cancel.disabled = true; fileIn.disabled = true; bar.hidden = false;
    let done = 0, failed = 0;
    for (const {p, photo} of parsed){
      try {
        if (photo && photos.checked){
          try {
            if (S.mode === 'store' && S.assets){ const r = await withRetry(() => S.assets.upload(b64ToBlob(photo.b64, photo.type), {type:photo.type === 'image/jpg' ? 'image/jpeg' : photo.type})); p.photo = r.id; }
            else if (S.mode !== 'store' && photo.b64.length < 60000){ p.photo = `data:${photo.type};base64,${photo.b64.replace(/\s/g,'')}`; }
          } catch(_){}
        }
        await persist(p); done++;
      } catch (e){ failed++; if (e && e.code === 'quota_exceeded'){ status.textContent = 'Storage is full, so the import stopped.'; break; } }
      bar.firstChild.style.width = `${Math.round((done + failed) / parsed.length * 100)}%`;
      status.textContent = `Imported ${done} of ${parsed.length}…`;
      if ((done + failed) % 20 === 0) renderList();
    }
    busy = false; cancel.disabled = false; cancel.textContent = 'Done';
    status.textContent = `Imported ${done} contact${done === 1 ? '' : 's'}.` + (failed ? ` ${failed} could not be saved; try importing the file again to pick them up.` : ' Add “How I know them” to each one as you go.');
    renderList(); if (!S.cur) renderMain();
  });
  const ov = h('div', {class:'overlay', onclick: e => { if (e.target === ov) close(); }},
    h('div', {class:'modal', role:'dialog', 'aria-label':'Import from iPhone'},
      h('h2', null, 'Import your iPhone contacts'),
      h('ol', null,
        h('li', null, 'On your iPhone, open the Contacts app and tap Lists in the top left.'),
        h('li', null, 'Press and hold All Contacts (or All iCloud), then tap Export.'),
        h('li', null, 'Save the file to Files, or AirDrop it to your computer.'),
        h('li', null, 'Choose that file below. People already here with the same name are skipped.')),
      h('div', {class:'file'}, h('label', {for:'vcfIn', style:{fontWeight:600}}, 'Contacts file (.vcf)'), fileIn,
        h('label', {class:'row', for:'impPhotos', style:{fontSize:'13px'}}, photos, 'Bring contact photos too')),
      bar, status,
      h('div', {class:'row', style:{justifyContent:'flex-end'}}, cancel, go)));
  document.body.append(ov);
}

const DEFAULT_DISPLAY = {mode:'auto', accent:'#2E6B57', size:'m', font:'book', density:'roomy', listPhotos:true, sort:'first', toolbar:'always', reminders:true};

function hexToHsl(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return [158, 40, 30];
  const n = parseInt(m[1], 16), r = (n >> 16 & 255)/255, g = (n >> 8 & 255)/255, b = (n & 255)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2; let hh = 0, ss = 0;
  if (mx !== mn){ const d = mx - mn; ss = l > .5 ? d/(2-mx-mn) : d/(mx+mn);
    hh = mx === r ? (g-b)/d + (g < b ? 6 : 0) : mx === g ? (b-r)/d + 2 : (r-g)/d + 4; hh *= 60; }
  return [Math.round(hh), Math.round(ss*100), Math.round(l*100)];
}
function applyDisplay(){

  if (typeof S !== 'undefined' && S.mode !== 'loading') renderList();
  const [hh, ss] = hexToHsl(display.accent); const sa = Math.min(ss, 75), n = Math.min(ss, 14);
  const light = `--accent:hsl(${hh} ${sa}% 32%);--accent-ink:#fff;--accent-soft:hsl(${hh} ${Math.min(sa,45)}% 92%);--accent-text:hsl(${hh} ${sa}% 27%);--bg:hsl(${hh} ${n}% 95.5%);--panel:hsl(${hh} ${n}% 97.5%);--line:hsl(${hh} ${n}% 86%);--line-2:hsl(${hh} ${n}% 91.5%);`;
  const dark = `--accent:hsl(${hh} ${Math.min(sa,60)}% 62%);--accent-ink:hsl(${hh} 40% 9%);--accent-soft:hsl(${hh} ${Math.min(sa,32)}% 17%);--accent-text:hsl(${hh} ${Math.min(sa,65)}% 74%);--bg:hsl(${hh} ${n}% 6.5%);--panel:hsl(${hh} ${n}% 8.5%);--surface:hsl(${hh} ${n}% 11.5%);--line:hsl(${hh} ${n}% 19%);--line-2:hsl(${hh} ${n}% 14.5%);`;

  st.textContent = `:root{${light}}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-cc="light"]){${dark}}}:root[data-theme="dark"]:not([data-cc="light"]),:root[data-cc="dark"]{${dark}}`;
}
applyDisplay();

async function boot(){
  renderMain();
  const c = window.claude;
  if (!c || typeof c.use !== 'function'){ await startDevice(); return; }
  const [db, assets, downloads] = await Promise.all([c.use('db').catch(() => null), c.use('assets').catch(() => null), c.use('downloads').catch(() => null)]);
  S.downloads = downloads;
  if (!db){ startLocal(); return; }
  S.db = db; S.assets = assets; setMode('store');
  db.doc('settings/display').onSnapshot(snap => {
    if (!snap.exists) return;
    const d = snap.data() || {};
    const next = Object.assign({}, DEFAULT_DISPLAY, d);
    if (stable(next) === stable(display)) return;
    display = next; applyDisplay();
    try { localStorage.setItem(DISPLAY_KEY, JSON.stringify(display)); } catch(_){}
  }, () => {});
  let first = true;
  db.collection('people').onSnapshot(snap => {
    const next = new Map(), trash = new Map();
    for (const d of snap.docs){ const o = Object.assign(clone(d.data()), {id:d.id}); (o.deletedAt ? trash : next).set(d.id, o); }
    S.trash = trash;
    // keep this page's in-flight edits for the open person
    if (S.cur && (saveT || saving) && S.people.has(S.cur.id)) next.set(S.cur.id, S.people.get(S.cur.id));
    S.people = next;
    onData();
    if (first){ first = false; renderMain(); purgeTrash(); }
  }, err => { toast('Lost the connection to your saved contacts. Reload the page to reconnect.'); });
}

function openTrash(){
  const body = h('div');
  const close = () => ov.remove();
  function draw(){
    body.replaceChildren();
    const items = [...S.trash.values()].sort((a,b) => b.deletedAt - a.deletedAt);
    if (!items.length) body.append(h('p', {class:'sec-note'}, 'Nothing here.'));
    for (const d of items){
      const left = Math.max(0, Math.ceil((d.deletedAt + TRASH_DAYS*86400000 - Date.now()) / 86400000));
      body.append(h('div', {class:'trash-row'},
        h('div', null, h('div', {style:{fontWeight:600}}, d.name || 'Unnamed'), h('div', {class:'sub'}, `Deleted ${fmtDate(new Date(d.deletedAt).toISOString().slice(0,10))} · gone for good in ${left} day${left === 1 ? '' : 's'}`)),
        h('div', {class:'acts'},
          h('button', {class:'btn small', type:'button', onclick: async () => { await restorePerson(d.id).catch(e => toast('Could not restore. ' + errText(e))); renderList(); draw(); toast(`${d.name || 'Card'} restored`); }}, 'Restore'),
          confirmBtn('Delete now', 'Tap again', async () => { await hardDelete(d.id).catch(() => {}); renderList(); draw(); }, 'btn small ghost'))));
    }
  }
  draw();
  const ov = h('div', {class:'overlay', onclick: e => { if (e.target === ov) close(); }},
    h('div', {class:'modal', role:'dialog', 'aria-label':'Recently deleted'},
      h('h2', null, 'Recently deleted'),
      h('p', {class:'sec-note'}, `Deleted people stay here for ${TRASH_DAYS} days, then they’re removed for good along with their photos.`),
      body,
      h('div', {class:'row', style:{justifyContent:'flex-end'}}, h('button', {class:'btn primary', type:'button', onclick:close}, 'Done'))));
  document.body.append(ov);
}
const blobToDataUrl = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
function dataUrlToBlob(u){ const m = /^data:([^;,]+)(;base64)?,(.*)$/s.exec(u); if (!m) return null; const bin = m[2] ? atob(m[3]) : decodeURIComponent(m[3]); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], {type:m[1]}); }
const newestEdit = list => list.reduce((m, p) => Math.max(m, p.updatedAt || 0, p.deletedAt || 0), 0);
function mediaIds(p){ return [p.photo, ...(p.media||[]).map(m => m.id), ...(p.gifts||[]).map(g => g.photo)].filter(Boolean); }
async function buildExport(status){
  const people = [...S.people.values(), ...S.trash.values()].map(clone);
  const ids = [...new Set(people.flatMap(mediaIds))].filter(id => !id.startsWith('data:'));
  const files = {};
  for (let i = 0; i < ids.length; i++){
    status(`Packing photos and videos: ${i+1} of ${ids.length}`);
    try { const r = await fetch(mediaUrl(ids[i])); if (r.ok) files[ids[i]] = await blobToDataUrl(await r.blob()); } catch(_){}
  }
  return {app:'The Living Dossier', format:1, exportedAt:new Date().toISOString(), newestEdit:newestEdit(people), display:Object.assign({}, display), people, files};
}
async function applyImport(data, status){
  const idMap = {};
  const entries = Object.entries(data.files || {});
  for (let i = 0; i < entries.length; i++){
    const [oldId, url] = entries[i];
    status(`Adding photos and videos: ${i+1} of ${entries.length}`);
    if (S.mode === 'store' && S.assets){
      const blob = dataUrlToBlob(url); if (!blob) continue;
      const type = /^video\//.test(blob.type) ? (/webm/.test(blob.type) ? 'video/webm' : 'video/mp4') : (/^image\/(png|jpeg|gif|webp)$/.test(blob.type) ? blob.type : 'image/jpeg');
      try { const r = await withRetry(() => S.assets.upload(blob, {type})); idMap[oldId] = r.id; } catch(_){}
    } else idMap[oldId] = url;
  }
  const remap = id => id && !id.startsWith('data:') ? (idMap[id] || null) : id;
  const oldPeople = [...S.people.values(), ...S.trash.values()];
  const oldAssets = new Set(oldPeople.flatMap(mediaIds).filter(id => !id.startsWith('data:')));
  const incoming = (data.people || []).map(p => {
    const n = clone(p);
    n.photo = remap(n.photo);
    n.media = (n.media||[]).map(m => Object.assign(m, {id:remap(m.id)})).filter(m => m.id);
    n.gifts = (n.gifts||[]).map(g => Object.assign(g, {photo:remap(g.photo)}));
    return n;
  });
  const keep = new Set(incoming.map(p => p.id));
  for (let i = 0; i < incoming.length; i++){ status(`Saving people: ${i+1} of ${incoming.length}`); await persist(incoming[i]); }
  for (const p of oldPeople) if (!keep.has(p.id)){
    S.people.delete(p.id); S.trash.delete(p.id);
    if (S.mode === 'store') await withRetry(() => S.db.doc('people/' + p.id).delete()).catch(() => {}); else saveLocal();
  }
  const newAssets = new Set(Object.values(idMap));
  if (S.assets) for (const id of oldAssets) if (!newAssets.has(id)) S.assets.delete(id).catch(() => {});
  if (data.display){ display = Object.assign({}, DEFAULT_DISPLAY, data.display); applyDisplay(); saveDisplay(); }
}
function openTransfer(){
  const status = h('p', {class:'sec-note', 'aria-live':'polite', style:{display:'block'}});
  const setS = t => { status.textContent = t; };
  const saveBtn = h('button', {class:'btn primary', type:'button'}, 'Save a copy');
  const fileIn = h('input', {type:'file', accept:'.json,application/json', id:'xferIn'});
  const confirmBox = h('div', {class:'xfer', hidden:true});
  const close = () => ov.remove();
  saveBtn.addEventListener('click', async () => {
    saveBtn.disabled = true;
    try {
      const data = await buildExport(setS);
      const filename = `living-dossier-${todayStr()}.json`, blob = new Blob([JSON.stringify(data)], {type:'application/json'});
      if (S.downloads){ setS('Waiting for you to confirm the save…'); await S.downloads.save({filename, data:blob}); }
      else {
        const file = new File([blob], filename, {type:'application/json'});
        const phone = matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({files:[file]});
        if (phone){
          // the share sheet needs a fresh tap, and packing photos can outlast the first one
          const share = h('button', {class:'btn primary', type:'button'}, 'Send or save the file');
          share.addEventListener('click', async () => { try { await navigator.share({files:[file], title:filename}); setS('Sent. Keep it in Files, or AirDrop it to your computer.'); share.remove(); } catch(e){ if (e && e.name !== 'AbortError') setS('Could not open the share menu. ' + (e.message || '')); } });
          saveBtn.after(share); saveBtn.disabled = false;
          setS(`Ready: ${data.people.length} people and ${Object.keys(data.files).length} photos and videos. Tap Send or save the file, then choose Save to Files or AirDrop.`);
          return;
        }
        const a = h('a', {href:URL.createObjectURL(blob), download:filename}); document.body.append(a); a.click(); a.remove();
      }
      setS(`Saved. The copy has ${data.people.length} people and ${Object.keys(data.files).length} photos and videos.`);
    } catch (e){ setS(e && e.code === 'declined' ? 'Save canceled.' : 'Could not save the copy. ' + (e && e.message || '')); }
    saveBtn.disabled = false;
  });
  fileIn.addEventListener('change', async () => {
    const f = fileIn.files[0]; if (!f) return;
    let data; try { data = JSON.parse(await f.text()); } catch(_){ setS('That file couldn’t be read. Choose a copy saved from this app.'); return; }
    if (!data || data.app !== 'The Living Dossier' || !Array.isArray(data.people)){ setS('That isn’t a copy saved from this app.'); return; }
    const here = [...S.people.values(), ...S.trash.values()];
    const older = newestEdit(here) > (data.newestEdit || 0);
    const go = h('button', {class:'btn primary', type:'button'}, 'Replace everything');
    confirmBox.replaceChildren(
      h('h3', null, `Copy from ${fmtDate(String(data.exportedAt).slice(0,10))}: ${data.people.filter(p => !p.deletedAt).length} people`),
      h('p', {class:'sec-note', style:{display:'block'}}, `This replaces everything here (${S.people.size} people) with the copy.`),
      ...(older ? [h('p', {class:'warn'}, 'Heads up: this device has changes newer than that copy. Replacing will undo them.')] : []),
      h('div', {class:'row'}, go, h('button', {class:'btn', type:'button', onclick: () => { confirmBox.hidden = true; fileIn.value = ''; }}, 'Cancel')));
    confirmBox.hidden = false;
    go.addEventListener('click', async () => {
      go.disabled = true;
      try { S.cur = null; await applyImport(data, setS); setS('Done. Everything here now matches the copy.'); confirmBox.hidden = true; renderMain(); renderList(); }
      catch (e){ setS('Something went wrong partway through. ' + errText(e) + ' Try again with the same file.'); }
    });
  });
  const ov = h('div', {class:'overlay', onclick: e => { if (e.target === ov) close(); }},
    h('div', {class:'modal', role:'dialog', 'aria-label':'Backup and transfer'},
      h('h2', null, 'Backup and transfer'),
      h('div', {class:'xfer'}, h('h3', null, 'Send from this device'),
        h('p', {class:'sec-note', style:{display:'block'}}, 'Saves one file with everyone, all your writing, photos and videos, and your display settings. Keep it as a backup, or AirDrop it to another device.'),
        h('div', null, saveBtn)),
      h('div', {class:'xfer'}, h('h3', null, 'Receive a copy'),
        h('p', {class:'sec-note', style:{display:'block'}}, 'Choose a copy saved from this app. The newest copy wins: it replaces everything on this device.'),
        h('label', {for:'xferIn', class:'sec-note', style:{display:'block'}}, fileIn)),
      confirmBox, status,
      h('div', {class:'row', style:{justifyContent:'flex-end'}}, h('button', {class:'btn', type:'button', onclick:close}, 'Close'))));
  document.body.append(ov);
}
